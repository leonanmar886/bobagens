<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bobagens Pages</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0b0d12; color: #e8ecf3; }
    .app { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .top { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .link { border: 1px solid #2a3140; background: #161b25; color: #d6deea; border-radius: 8px; padding: 8px 12px; text-decoration: none; font-size: 14px; }
    .link.active { background: #2e67ff; border-color: #2e67ff; color: white; }
    .title { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
    .frame-wrap { background: #121722; border: 1px solid #202838; border-radius: 12px; overflow: hidden; }
    iframe { border: 0; width: 100%; height: calc(100vh - 180px); min-height: 620px; background: #fff; }
  </style>
</head>
<body>
  <div class="app">
    <h1 class="title" id="page-title">Bobagens Pages</h1>
    <nav class="top" id="nav"></nav>
    <section class="frame-wrap">
      <iframe id="view" title="Conteúdo"></iframe>
    </section>
  </div>
  <script>
    const routes = {
      '/': { title: 'Início', file: 'pages/home.html' },
      '/financial-roadmap': { title: 'Financial Roadmap Simulator', file: 'pages/financial_roadmap_simulator.html' },
      '/treinos': { title: 'Plano de Treinos', file: 'pages/treinos.html' },
      '/treino-dudu': { title: 'Treino Dudu', file: 'pages/ficha-de-treino.html' }
    };

    function getPath() {
      const hash = location.hash.replace(/^#/, '');
      if (!hash) return '/';
      return hash.startsWith('/') ? hash : '/' + hash;
    }

    function renderNav(activePath) {
      const nav = document.getElementById('nav');
      nav.innerHTML = '';
      Object.entries(routes).forEach(([path, config]) => {
        const a = document.createElement('a');
        a.href = '#' + path;
        a.textContent = config.title;
        a.className = 'link' + (path === activePath ? ' active' : '');
        nav.appendChild(a);
      });
    }

    function render() {
      const path = getPath();
      const route = routes[path] || routes['/'];
      document.getElementById('page-title').textContent = route.title;
      document.getElementById('view').src = route.file;
      renderNav(path in routes ? path : '/');
    }

    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
